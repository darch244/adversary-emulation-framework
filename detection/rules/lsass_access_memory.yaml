title: LSASS Process Memory Access
id: 8a3e2c1f-9d4b-4f7a-b2e5-1c6d8a0f3b2a
status: stable
description: Detects attempts to open the Local Security Authority Subsystem Service (LSASS) process memory, a common credential-dumping primitive.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Mostafa Ibrahim (DarcHacker)
date: 2026/01/01
modified: 2026/01/01
tags:
  - attack.t1003
  - attack.credential_access
logsource:
  product: windows
  category: process_access
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains: '0x1010'
  filter_benign:
    SourceImage|endswith: '\svchost.exe'
  condition: selection and not filter_benign
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
falsepositives:
  - Legitimate security tooling accessing LSASS
level: critical